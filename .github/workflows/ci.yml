name: CI

on:
  push: 
    branches: [main]
  pull_request:
      
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
     